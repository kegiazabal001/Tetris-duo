[package]
name = "tetris-duo"
version = "1.0.0"
edition = "2021"

[dependencies]
bevy = { version = "0.16", default-features = false, features = [
    "bevy_asset",
    "bevy_winit",
    "bevy_render",
    "bevy_sprite",
    "bevy_text",
    "bevy_ui",
    "bevy_state",
    "bevy_audio",
    "vorbis",
    "default_font",
    "x11",
    "wayland",
] }
leafwing-input-manager = "0.17"
rand = "0.8"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
